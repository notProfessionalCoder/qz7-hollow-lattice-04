name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: Python 服务 · lint + 测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    name: 前端 · 类型检查 + 测试 + 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows:
    name: Windows 安装包
    needs: [service, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/pyproject.toml
      - name: 打包 Python 服务为 sidecar
        working-directory: service
        shell: pwsh
        run: |
          pip install -e ".[dev]"
          pyinstaller --onefile --name jarvis-service `
            --collect-submodules jarvis_service --collect-submodules uvicorn `
            pyinstaller_entry.py
          $triple = (rustc -vV | Select-String '^host: ').ToString().Split(' ')[1]
          Copy-Item dist/jarvis-service.exe "../app/src-tauri/binaries/jarvis-service-$triple.exe"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app
      - name: Rust fmt + clippy
        working-directory: app/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: 构建安装包
        working-directory: app
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-desktop-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
