name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: Python 服务 · lint + 测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    name: 前端 · 类型检查 + 测试 + 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows:
    name: Windows 安装包
    needs: [service, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/pyproject.toml
      - name: 打包 Python 服务为 sidecar
        working-directory: service
        shell: pwsh
        run: |
          pip install -e ".[dev]"
          pyinstaller --onefile --name jarvis-service `
            --collect-submodules jarvis_service --collect-submodules uvicorn --collect-submodules websockets `
            pyinstaller_entry.py
          $triple = (rustc -vV | Select-String '^host: ').ToString().Split(' ')[1]
          Copy-Item dist/jarvis-service.exe "../app/src-tauri/binaries/jarvis-service-$triple.exe"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app
      - name: Rust fmt + clippy
        working-directory: app/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: 构建安装包
        working-directory: app
        run: npx tauri build

      - name: 冒烟测试：直接跑打包后的服务
        shell: pwsh
        env:
          JARVIS_PORT: "8799"
        run: |
          $p = Start-Process service/dist/jarvis-service.exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep 1
            try { Invoke-RestMethod http://127.0.0.1:8799/health | ConvertTo-Json; $ok = $true; break } catch {}
          }
          if ($ok) { Invoke-RestMethod http://127.0.0.1:8799/plugins/system | ConvertTo-Json -Depth 4 }
          # 单文件 exe 有两层进程，要连子进程一起杀
          taskkill /T /F /PID $p.Id | Out-Null
          Get-Content "$env:APPDATA\jarvis\logs\service.log" -ErrorAction SilentlyContinue
          Remove-Item "$env:APPDATA\jarvis\logs" -Recurse -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "frozen service did not answer /health" }

      - name: 冒烟测试：安装后启动，确认自动拉起服务且 HUD 连上
        shell: pwsh
        run: |
          Start-Sleep 2
          if (Get-Process jarvis-service -ErrorAction SilentlyContinue) { throw "leftover jarvis-service from previous step" }
          $installer = Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process $installer.FullName -ArgumentList '/S' -Wait
          $dir = Get-ChildItem "$env:LOCALAPPDATA" -Directory | Where-Object Name -like 'Jarvis*' | Select-Object -First 1
          $app = Join-Path $dir.FullName 'jarvis-desktop.exe'
          $p = Start-Process $app -PassThru
          $logs = "$env:APPDATA\jarvis\logs"
          $health = $false; $hud = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep 1
            if (-not $health) { try { Invoke-RestMethod http://127.0.0.1:8765/health | Out-Null; $health = $true; "health ok after ${i}s" } catch {} }
            if ($health -and (Select-String -Path "$logs\service.log" -Pattern 'WebSocket /ws' -Quiet -ErrorAction SilentlyContinue)) { $hud = $true; "HUD websocket connected after ${i}s"; break }
          }
          Get-Process | Where-Object { $_.ProcessName -match 'jarvis' } | Format-Table Id, ProcessName, Path -AutoSize | Out-String -Width 300
          Get-ChildItem $logs -ErrorAction SilentlyContinue | ForEach-Object { "===== $($_.Name)"; Get-Content $_.FullName -Tail 60 }
          # 外壳被强杀后，服务应在几秒内自行退出
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep 6
          $orphan = Get-Process jarvis-service -ErrorAction SilentlyContinue
          if ($orphan) { "orphan service still running"; $orphan | Format-Table Id, Path | Out-String -Width 300 }
          "===== service.log after shell was killed"
          Get-Content "$logs\service.log" -Tail 8 -ErrorAction SilentlyContinue
          if (-not $health) { throw "installed app did not start the service" }
          if (-not $hud) { throw "service is up but the HUD never opened the WebSocket" }
          if ($orphan) { throw "service outlived the shell" }

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-desktop-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
