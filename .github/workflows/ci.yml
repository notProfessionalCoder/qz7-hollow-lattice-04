name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: Python 服务 · lint + 测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    name: 前端 · 类型检查 + 测试 + 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows:
    name: Windows 安装包
    needs: [service, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/pyproject.toml
      - name: 打包 Python 服务为 sidecar
        working-directory: service
        shell: pwsh
        run: |
          pip install -e ".[dev]"
          pyinstaller --onefile --name jarvis-service `
            --collect-submodules jarvis_service --collect-submodules uvicorn `
            pyinstaller_entry.py
          $triple = (rustc -vV | Select-String '^host: ').ToString().Split(' ')[1]
          Copy-Item dist/jarvis-service.exe "../app/src-tauri/binaries/jarvis-service-$triple.exe"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app
      - name: Rust fmt + clippy
        working-directory: app/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: 构建安装包
        working-directory: app
        run: npx tauri build

      - name: 冒烟测试：直接跑打包后的服务
        shell: pwsh
        run: |
          $p = Start-Process service/dist/jarvis-service.exe -PassThru -RedirectStandardError svc-err.txt -RedirectStandardOutput svc-out.txt
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep 1
            try { Invoke-RestMethod http://127.0.0.1:8765/health | ConvertTo-Json; $ok = $true; break } catch {}
          }
          if ($ok) { Invoke-RestMethod http://127.0.0.1:8765/plugins/system | ConvertTo-Json -Depth 4 }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Content svc-out.txt, svc-err.txt -ErrorAction SilentlyContinue
          if (-not $ok) { throw "frozen service did not answer /health" }

      - name: 冒烟测试：安装后启动，确认自动拉起服务
        shell: pwsh
        run: |
          $installer = Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process $installer.FullName -ArgumentList '/S' -Wait
          $dir = Get-ChildItem "$env:LOCALAPPDATA" -Directory | Where-Object Name -like 'Jarvis*' | Select-Object -First 1
          Get-ChildItem $dir.FullName -Recurse | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300
          $app = Get-ChildItem $dir.FullName -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall|jarvis-service' } | Select-Object -First 1
          $p = Start-Process $app.FullName -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 1
            try { Invoke-RestMethod http://127.0.0.1:8765/health | ConvertTo-Json; $ok = $true; break } catch {}
          }
          Get-Process | Where-Object { $_.ProcessName -match 'jarvis' } | Format-Table Id, ProcessName, Path -AutoSize | Out-String -Width 300
          Get-ChildItem "$env:APPDATA\jarvis\logs" -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName -Tail 80 }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "installed app did not start the service" }

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-desktop-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
