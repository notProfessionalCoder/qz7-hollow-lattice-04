[project]
name = "jarvis-service"
version = "0.1.0"
description = "贾维斯桌面的本地服务：插件式数据源 + WebSocket 推送"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psutil>=6",
    "nvidia-ml-py>=12",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
    "pyinstaller>=6.10",
]

[project.scripts]
jarvis-service = "jarvis_service.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
